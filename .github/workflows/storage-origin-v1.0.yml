name: Everia v1.0 Stage 1 storage-origin probe

on:
  push:
    branches:
      - v1.0
    paths:
      - scripts/storage-origin-probe.cjs
      - scripts/profile-verification.cjs
      - .github/workflows/storage-origin-v1.0.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-origin:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          architecture: x64
          cache: npm
      - name: Install and build the exact v0.9 app
        run: npm ci
      - name: Preserve v0.9 backend and provider gates
        run: npm test
      - name: Preserve v0.9 UI gates
        run: npm run test:ui
      - run: npm run build
      - name: Package using the proven PowerShell invocation
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $packagerArgs = @(
            "--no-install"
            "electron-packager"
            "."
            "Everia"
            "--platform=win32"
            "--arch=x64"
            "--app-version=0.9.0"
            "--icon=public/assets/branding/everia-windows-icon.ico"
            "--out=release"
            "--overwrite"
            "--asar"
            "--prune=true"
            "--ignore=^/(src|upload|release|node_modules/.cache)(/|$)"
            "--ignore=\.(zip|tsbuildinfo)$"
            "--ignore=^/.*\.(spec\.tsx|test\.ts|providers\.test\.cjs|credential-store\.test\.cjs|window-state\.test\.cjs)$"
          )
          & npx @packagerArgs
          if ($LASTEXITCODE -ne 0) { throw "Packager failed: $LASTEXITCODE" }
      - name: Launch from four paths against one v0.9 profile
        run: node scripts/storage-origin-probe.cjs
