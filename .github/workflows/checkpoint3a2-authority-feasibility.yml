name: Checkpoint 3A.2 disposable authority feasibility
on:
  push:
    branches: [qa/checkpoint3a2-container-authority]
    paths:
      - tests/container-authority/**
      - .github/workflows/checkpoint3a2-authority-feasibility.yml
      - docs/checkpoint3a2-authority-feasibility.md
permissions:
  contents: read
jobs:
  authority-experiment:
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify immutable production boundary
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD) -ne '${{ github.sha }}') { throw 'Wrong exact source' }
          if ((git rev-parse origin/main) -ne 'fd98cfa3f79c10cebcf757f22a52e98d0f547e93') { throw 'main moved' }
          if ((git cat-file -t v0.9) -ne 'tag' -or (git rev-parse 'v0.9^{commit}') -ne 'fd98cfa3f79c10cebcf757f22a52e98d0f547e93') { throw 'stable tag moved/type mismatch' }
          if ((git rev-parse origin/v1.0) -ne '5426ad4aa28888c336cbb71e0024652dd4c958c7') { throw 'v1.0 moved' }
          git merge-base --is-ancestor c79b0d26044f0fd057496f62a6cfe443da5b98ff HEAD
          if ($LASTEXITCODE) { throw 'Wrong CP2 parent' }
          foreach ($path in (git diff --name-only c79b0d26044f0fd057496f62a6cfe443da5b98ff HEAD)) {
            if ($path -notmatch '^(tests/container-authority/|docs/checkpoint3a2-authority-feasibility.md$|\.github/workflows/checkpoint3a2-authority-feasibility.yml$)') { throw "Production change: $path" }
          }
          git diff --check c79b0d26044f0fd057496f62a6cfe443da5b98ff HEAD
          if ($LASTEXITCODE -or (git status --porcelain)) { throw 'Dirty/invalid source' }
          $evidence = Join-Path $env:RUNNER_TEMP 'cp3a2-evidence'
          New-Item -ItemType Directory $evidence | Out-Null
          "EVIDENCE=$evidence" >> $env:GITHUB_ENV
          git rev-parse HEAD | Set-Content "$evidence/source.txt"
          Get-ComputerInfo -Property OsName,OsVersion,WindowsVersion | Format-List | Out-File "$evidence/environment.txt"
          Get-Volume | Format-Table DriveLetter,FileSystem,DriveType | Out-File "$evidence/volumes.txt"
          whoami /all | Out-File "$evidence/publisher-token.txt"
      - name: Compile disposable native prototype with unchanged CP2 source
        id: compile
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/generation/fixture.py "$env:RUNNER_TEMP/cp3a2-fixture"
          if ($LASTEXITCODE) { throw 'Fixture creation failed' }
          cmake -S tests/container-authority -B "$env:RUNNER_TEMP/cp3a2-build" -A x64 -DEVERIA_GENERATION_TESTS=OFF "-DEVERIA_PAYLOAD_DIR=$env:RUNNER_TEMP/cp3a2-fixture" -DEVERIA_SOURCE_SHA=c79b0d26044f0fd057496f62a6cfe443da5b98ff -DEVERIA_BUILD_ID=authority-test-only -DEVERIA_ARCHIVE_SHA=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          if ($LASTEXITCODE) { throw 'Configure failed' }
          cmake --build "$env:RUNNER_TEMP/cp3a2-build" --config Release --target authority-completion
          if ($LASTEXITCODE) { throw 'Compile failed' }
      - name: Missing genuine contexts and combined reopen attacks only
        run: |
          $ErrorActionPreference = 'Stop'
          $nonce = [guid]::NewGuid().ToString('N')
          $root = Join-Path $env:RUNNER_TEMP "cp3a2-$nonce"
          New-Item -ItemType Directory $root | Out-Null
          $namespace = "Software\Everia-CP3A2-$nonce"
          $env:CP3A2_ROOT = $root
          & icacls.exe $root /grant '*S-1-5-11:(OI)(CI)M' | Out-File "$env:EVIDENCE/fixture-permissions.txt"
          if ($LASTEXITCODE) { throw 'Disposable fixture permissions failed' }
          $names = @()
          try {
            foreach ($kind in @('OWNER','OTHER','ADMIN')) {
              $name = 'CP3' + $kind + $nonce.Substring(0,8)
              $password = 'Aa1!' + [guid]::NewGuid().ToString('N')
              Write-Output "::add-mask::$password"
              New-LocalUser -Name $name -Password (ConvertTo-SecureString $password -AsPlainText -Force) -AccountNeverExpires | Out-Null
              $names += $name
              Add-LocalGroupMember -SID 'S-1-5-32-545' -Member $name
              if ($kind -eq 'ADMIN') { Add-LocalGroupMember -SID 'S-1-5-32-544' -Member $name }
              [Environment]::SetEnvironmentVariable("CP3_$kind",$name,'Process')
              [Environment]::SetEnvironmentVariable(('CP3_' + $kind + '_PASSWORD'),$password,'Process')
            }
            Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' -Name EnableLUA | Format-List | Out-File "$env:EVIDENCE/uac-policy.txt"
            $exe = "$env:RUNNER_TEMP/cp3a2-build/Release/authority-completion.exe"
            & $exe completion $namespace $root 2>&1 | Tee-Object "$env:EVIDENCE/completion-results.txt"
            if ($LASTEXITCODE) { throw 'Missing-coverage harness failed' }
            $systemScript = Join-Path $env:RUNNER_TEMP "cp3a2-system-$nonce.ps1"
            @(
              ("& '{0}' probe '{1}' SYSTEM trusted *> '{2}/system-results.txt'" -f $exe,$namespace,$env:EVIDENCE),
              'exit $LASTEXITCODE'
            ) | Set-Content $systemScript
            $taskName = "Everia-CP3A2-$nonce"
            $arguments = '-NoProfile -ExecutionPolicy Bypass -File "' + $systemScript + '"'
            $action = New-ScheduledTaskAction -Execute 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe' -Argument $arguments
            Register-ScheduledTask -TaskName $taskName -Action $action -User SYSTEM -RunLevel Highest -Force | Out-Null
            try {
              Start-ScheduledTask -TaskName $taskName
              $deadline = (Get-Date).AddSeconds(45)
              do {
                Start-Sleep -Milliseconds 500
                $info = Get-ScheduledTaskInfo -TaskName $taskName
                $task = Get-ScheduledTask -TaskName $taskName
              } while (($info.LastRunTime.Year -lt 2026 -or $task.State -eq 'Running') -and (Get-Date) -lt $deadline)
              Get-Content "$env:EVIDENCE/system-results.txt"
              if ($task.State -eq 'Running' -or $info.LastTaskResult -ne 0) { throw "SYSTEM context failed: $($info.LastTaskResult)" }
            } finally { Unregister-ScheduledTask -TaskName $taskName -Confirm:$false }
            @{ source='${{ github.sha }}'; baseline_run=37211223847; namespace=$namespace; root=$root; decision='UNPROVEN pending evidence review'; no_cp2_rerun=$true } | ConvertTo-Json | Set-Content "$env:EVIDENCE/completion.json"
          } finally {
            foreach ($name in $names) { Remove-LocalUser -Name $name -ErrorAction Continue }
          }
      - name: Upload evidence only
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: checkpoint3a2-authority-feasibility-evidence
          path: ${{ runner.temp }}/cp3a2-evidence
          if-no-files-found: error
          retention-days: 90
